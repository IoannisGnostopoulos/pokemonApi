<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Card Collection</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>⚡ Pokémon Card Collection</h1>
        <div id="user-info" class="hidden">
            <span>Καλώς ήρθες, <strong id="username-display"></strong>!</span>
            <button id="logout-btn" onclick="logout()">Αποσύνδεση</button>
        </div>
    </header>

    <main>
        <!-- Φόρμες Auth (Εμφανίζονται όταν ο χρήστης ΔΕΝ είναι συνδεδεμένος) -->
        <section id="auth-section" class="auth-container">
            <div class="auth-box">
                <h2>Σύνδεση</h2>
                <form id="login-form">
                    <input type="text" id="login-username" placeholder="Username" required>
                    <input type="password" id="login-password" placeholder="Password" required>
                    <button type="submit">Login</button>
                </form>
            </div>

            <div class="auth-box">
                <h2>Εγγραφή</h2>
                <form id="register-form">
                    <input type="text" id="reg-username" placeholder="Username" required>
                    <input type="password" id="reg-password" placeholder="Password" required>
                    <button type="submit">Register</button>
                </form>
            </div>
        </section>

        <!-- Περιοχή Καρτών (Εμφανίζεται όταν ο χρήστης ΕΙΝΑΙ συνδεδεμένος) -->
        <section id="collection-section" class="hidden">
            <div class="stats">
                <h2>Η Συλλογή σου: <span id="owned-count">0</span> / 100 Pokémon</h2>
            </div>
            <div id="pokemon-grid" class="grid"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
